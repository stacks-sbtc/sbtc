services:
  bitcoind:
    image: bitcoin/bitcoin:${BITCOIN_CORE_VERSION:-25.2}
    volumes:
      - ./bitcoin/bitcoin.conf:/root/.bitcoin/bitcoin.conf:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        bitcoind
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:18443:18443"
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli getblockcount"]
      interval: 3s
      timeout: 1s
      retries: 3

  postgres:
    image: postgres:16.6-bookworm@sha256:c965017e1d29eb03e18a11abc25f5e3cd78cb5ac799d495922264b8489d5a3a1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=signer"]
      interval: 2s
      timeout: 1s
      retries: 5

  emily-dynamodb:
    image: "amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."
    ports:
      - "127.0.0.1:8000:8000"
    # Make a real ListTables request, so that DynamoDB Local is healthy only
    # once it can serve the requests that we make. It doesn't verify
    # signatures, but it rejects requests without an Authorization header.
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          curl --silent --fail --output /dev/null --request POST
          --header 'X-Amz-Target: DynamoDB_20120810.ListTables'
          --header 'Content-Type: application/x-amz-json-1.0'
          --header 'Authorization: AWS4-HMAC-SHA256 Credential=healthcheck/20000101/us-west-2/dynamodb/aws4_request, SignedHeaders=host, Signature=0'
          --data '{}' http://localhost:8000
      interval: 1s
      timeout: 1s
      retries: 30

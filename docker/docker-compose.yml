# Variables
# ------------------------------------------------------------------------------
x-common-vars:
  - &BTC_ADDR miEJtNKa3ASpA19v5ZhvbKTEieYjLpzCYT
  - &MINER_SEED 9e446f6b0c6a96cf2190e54bcd5a8569c3e386f091605499464389b8d4e0bfc201 # stx: STEW4ZNT093ZHK4NEQKX8QJGM2Y7WWJ2FQQS5C19, btc: miEJtNKa3ASpA19v5ZhvbKTEieYjLpzCYT, pub_key: 035379aa40c02890d253cfa577964116eb5295570ae9f7287cbae5f2585f5b2c7c, wif: cStMQXkK5yTFGP3KbNXYQ3sJf2qwQiKrZwR9QJnksp32eKzef1za
  - &BITCOIN_PEER_PORT 18444
  - &BITCOIN_RPC_PORT 18443
  - &BITCOIN_RPC_USER devnet
  - &BITCOIN_RPC_PASS devnet
  - &MINE_INTERVAL ${MINE_INTERVAL:-1s}
  - &MINE_INTERVAL_EPOCH25 ${MINE_INTERVAL_EPOCH25:-1s} # 1 second bitcoin block times in epoch 2.5
  - &MINE_INTERVAL_EPOCH3 ${MINE_INTERVAL_EPOCH3:-15s} # bitcoin block interval in epoch 3; below 15s the chain wedges
  - &MINE_INTERVAL_EPOCH4 ${MINE_INTERVAL_EPOCH4:-30}   # base seconds between blocks once epoch 4 is active
  - &MINE_GRACE_SECS ${MINE_GRACE_SECS:-30}             # extra window per block for the block-commit to arrive
  - &NAKAMOTO_BLOCK_INTERVAL 2 # seconds to wait between issuing stx-transfer transactions (which triggers Nakamoto block production)
  - &STACKS_20_HEIGHT ${STACKS_20_HEIGHT:-0}
  - &STACKS_2_05_HEIGHT ${STACKS_2_05_HEIGHT:-203}
  - &STACKS_21_HEIGHT ${STACKS_21_HEIGHT:-204}
  - &STACKS_POX2_HEIGHT ${STACKS_POX2_HEIGHT:-205} # 104 is is stacks_block=1, 106 is stacks_block=3
  - &STACKS_22_HEIGHT ${STACKS_22_HEIGHT:-206}
  - &STACKS_23_HEIGHT ${STACKS_23_HEIGHT:-207}
  - &STACKS_24_HEIGHT ${STACKS_24_HEIGHT:-208}
  - &STACKS_25_HEIGHT ${STACKS_25_HEIGHT:-209}
  # The earliest block for Epoch 3 is during cycle 11, which starts at
  # 220. Epoch 3 must not activate in the same-cycle that Epoch 2.5
  # activates in.
  - &STACKS_30_HEIGHT ${STACKS_30_HEIGHT:-222}
  - &STACKS_31_HEIGHT ${STACKS_31_HEIGHT:-223}
  - &STACKS_32_HEIGHT ${STACKS_32_HEIGHT:-224}
  - &STACKS_33_HEIGHT ${STACKS_33_HEIGHT:-225}
  - &STACKS_34_HEIGHT ${STACKS_34_HEIGHT:-226}
  # Epoch 4 must activate in a different reward cycle from Epoch 3, and it
  # must not activate during a prepare phase.
  - &STACKS_40_HEIGHT ${STACKS_40_HEIGHT:-242}
  - &STACKING_CYCLES ${STACKING_CYCLES:-1} # number of cycles to stack-stx or stack-extend for
  - &POX_PREPARE_LENGTH ${POX_PREPARE_LENGTH:-5}
  - &POX_REWARD_LENGTH ${POX_REWARD_LENGTH:-20}
  - &REWARD_RECIPIENT ${REWARD_RECIPIENT:-STQM73RQC4EX0A07KWG1J5ECZJYBZS4SJ4ERC6WN} # priv: 6ad9cadb42d4edbfbe0c5bfb3b8a4125ddced021c4174f829b714ccbf527f02001
  - &EXIT_FROM_MONITOR 1 # set to "1" to automatically shut down via monitor.ts

# Templates
# ------------------------------------------------------------------------------

x-postgres: &postgres
  image: postgres:16.6-bookworm@sha256:c965017e1d29eb03e18a11abc25f5e3cd78cb5ac799d495922264b8489d5a3a1
  stop_grace_period: 5s
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: signer
  profiles:
    - sbtc-signer
    - sbtc-postgres

x-sbtc-signer: &sbtc-signer
  build:
    context: ../
    dockerfile: docker/sbtc/Dockerfile
    target: signer
  logging:
    driver: fluentd
    options:
      fluentd-address: "127.0.0.1:24224"
      fluentd-async: "true"
      tag: "{{.Name}}"
  entrypoint:
    - "/usr/local/bin/signer"
    - "--config"
    - "/signer-config.toml"
    - "--migrate-db"
    - "--output-format"
    - "json"
  environment: &sbtc-signer-environment
    RUST_LOG: info,signer=debug
    SIGNER_SIGNER__P2P__LISTEN_ON: tcp://0.0.0.0:4122
  volumes:
    - ./sbtc/signer/signer-config.toml:/signer-config.toml
  profiles:
    - sbtc-signer
  # When using the published signer image, we don't have curl/wget/nc, so
  # we use bash's /dev/tcp to probe the metrics port. Switched to this so
  # that it's easy when using the published images.
  healthcheck:
    test: ["CMD", "bash", "-c", "true < /dev/tcp/localhost/8801"]
    start_period: 10s
    start_interval: 1s
    interval: 30s
    timeout: 1s

# Postgres clients that seed each signer's database with pre-computed DKG
# shares.
x-sbtc-signer-seed: &sbtc-signer-seed
  image: postgres:16.6-bookworm@sha256:c965017e1d29eb03e18a11abc25f5e3cd78cb5ac799d495922264b8489d5a3a1
  restart: "no"
  profiles:
    - seeded
  entrypoint:
    - /bin/bash
    - -c
    - |
      set -e
      PGPASSWORD=postgres psql -h $${TARGET} -U postgres -d signer -v ON_ERROR_STOP=1 -f /seed/signer.sql

x-stacks-signer: &stacks-signer
  image: ghcr.io/stacks-network/stacks-signer:4.0.2@sha256:16fca040a7122ba3f30680fe92c17497ab88dc08a3d81f7e88c5bfc8df927c9f
  profiles:
    - default
  depends_on:
    - stacks-node
  volumes:
    - ./stacks/stacks-signer.toml:/data/config.toml.in
  environment: &stacks-signer-environment
    STACKS_NODE_HOST: stacks-node:20443
    STACKS_SIGNER_ENDPOINT: 0.0.0.0:30000
  entrypoint:
    - /bin/bash
    - -c
    - |
      cd /data/
      set -e
      perl -pe 's/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/$$ENV{$1}/ge' < config.toml.in > config.toml
      exec stacks-signer run --config config.toml

# Services.
# ------------------------------------------------------------------------------
services:

  # Emily API.
  # ----------
  # DynamoDB Tables for the Emily API.
  emily-dynamodb:
    image: "amazon/dynamodb-local:latest"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."
    ports:
      - "127.0.0.1:8000:8000"
    profiles:
      - default

  # Runs the Emily server.
  emily-server:
    build:
      context: ../
      dockerfile: docker/sbtc/Dockerfile
      target: emily-server
    depends_on:
      devenv-setup:
        condition: service_healthy
    environment:
      - DYNAMODB_ENDPOINT=http://emily-dynamodb:8000
      - AWS_ACCESS_KEY_ID=xxxxxxxxxxxx
      - AWS_SECRET_ACCESS_KEY=xxxxxxxxxxxx
      - AWS_REGION=us-west-2
      - PORT=3031
      - DEFAULT_PEG_CAP=100000000000
      - DEFAULT_PER_DEPOSIT_CAP=100000000
      - DEFAULT_PER_WITHDRAWAL_CAP=100000000
      - DEFAULT_ROLLING_WITHDRAWAL_BLOCKS=144
      - DEFAULT_ROLLING_WITHDRAWAL_CAP=100000000000
      - DEPLOYER_ADDRESS=SN3R84XZYA63QS28932XQF3G1J8R9PC3W76P9CSQS
    ports:
      - "127.0.0.1:3031:3031"
    profiles:
      - default

  emily-sidecar:
    build:
      context: ../
      dockerfile: docker/sbtc/emily-sidecar/Dockerfile
      target: emily-sidecar
    restart: on-failure
    ports:
      - "127.0.0.1:20540:20540"
    environment:
      EMILY_API_KEY: testApiKey
      EMILY_ENDPOINT: http://emily-server:3031
    profiles:
      - default
    depends_on:
      - emily-server

  # One-shot devenv setup helper: creates Emily's DynamoDB tables, then waits
  # for the signers to confirm a rotate-keys-wrapper contract call before
  # broadcasting a donation. Exits 0 once both phases complete.
  devenv-setup:
    build:
      context: ../
      dockerfile: docker/sbtc/devenv-setup/Dockerfile
      target: devenv-setup
    environment:
      - DYNAMODB_ENDPOINT=http://emily-dynamodb:8000
      - STACKS_RPC_URL=http://stacks-node:20443
      - BITCOIN_RPC_URL=http://devnet:devnet@bitcoin:18443/wallet/depositor
      - DEPLOYER_ADDRESS=SN3R84XZYA63QS28932XQF3G1J8R9PC3W76P9CSQS
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/aws-setup-ready"]
      interval: 2s
      timeout: 2s
      retries: 300
      start_period: 2s
    profiles:
      - default
    depends_on:
      - emily-dynamodb
      - bitcoin
      - bitcoin-miner
      - stacks-node

  emily-cron:
    build:
      context: ../
      dockerfile: docker/sbtc/emily-cron/Dockerfile
      target: emily-cron
    restart: on-failure
    environment:
      - EMILY_API_KEY=testApiKey
      - EMILY_ENDPOINT=http://emily-server:3031
      - PRIVATE_EMILY_ENDPOINT=http://emily-server:3031
      - MEMPOOL_API_URL=http://mempool-api:8999/api
      - ELECTRS_API_URL=http://electrs:3002
      - HIRO_API_URL=https://api.hiro.so
      - DEPLOYER_ADDRESS=SN3R84XZYA63QS28932XQF3G1J8R9PC3W76P9CSQS
    profiles:
      - default
      - bitcoin-mempool
    depends_on:
      - emily-server
      - mempool-api

  # sBTC Signers.
  # ------------------
  # sbtc signer 1 ----
  postgres-1:
    <<: *postgres # Inherit all from the "postgres" service
    container_name: postgres-1
    ports:
      - "127.0.0.1:5432:5432"

  sbtc-signer-1:
    <<: *sbtc-signer # Inherit all from the "sbtc-signer" service
    container_name: sbtc-signer-1
    depends_on:
      - postgres-1
      - bitcoin-pruned
    environment:
      <<: *sbtc-signer-environment
      SIGNER_SIGNER__DB_ENDPOINT: postgresql://postgres:postgres@postgres-1:5432/signer
      SIGNER_SIGNER__PRIVATE_KEY: 41634762d89dfa09133a4a8e9c1378d0161d29cd0a9433b51f1e3d32947a73dc
      SIGNER_SIGNER__P2P__SEEDS: tcp://sbtc-signer-2:4122,tcp://sbtc-signer-3:4122
      SIGNER_SIGNER__PROMETHEUS_EXPORTER_ENDPOINT: 0.0.0.0:9181
    ports:
      - "127.0.0.1:8801:8801"

  # sbtc signer 2 ----
  postgres-2:
    <<: *postgres # Inherit all from the "postgres" service
    container_name: postgres-2
    ports:
      - "127.0.0.1:5433:5432"

  sbtc-signer-2:
    <<: *sbtc-signer # Inherit all from the "sbtc-signer" service
    container_name: sbtc-signer-2
    depends_on:
      - postgres-2
      - bitcoin-pruned
    environment:
      <<: *sbtc-signer-environment
      SIGNER_SIGNER__DB_ENDPOINT: postgresql://postgres:postgres@postgres-2:5432/signer
      SIGNER_SIGNER__PRIVATE_KEY: 9bfecf16c9c12792589dd2b843f850d5b89b81a04f8ab91c083bdf6709fbefee01
      SIGNER_SIGNER__P2P__SEEDS: tcp://sbtc-signer-1:4122,tcp://sbtc-signer-3:4122
      SIGNER_SIGNER__PROMETHEUS_EXPORTER_ENDPOINT: 0.0.0.0:9182
    ports:
      - "127.0.0.1:8802:8801"

  # sbtc signer 3 ----
  postgres-3:
    <<: *postgres # Inherit all from the "postgres" service
    container_name: postgres-3
    ports:
      - "127.0.0.1:5434:5432"

  sbtc-signer-3:
    <<: *sbtc-signer # Inherit all from the "sbtc-signer" service
    container_name: sbtc-signer-3
    depends_on:
      - postgres-3
      - bitcoin-pruned
    environment:
      <<: *sbtc-signer-environment
      SIGNER_SIGNER__DB_ENDPOINT: postgresql://postgres:postgres@postgres-3:5432/signer
      SIGNER_SIGNER__PRIVATE_KEY: 3ec0ca5770a356d6cd1a9bfcbf6cd151eb1bd85c388cc00648ec4ef5853fdb7401
      SIGNER_SIGNER__P2P__SEEDS: tcp://sbtc-signer-1:4122,tcp://sbtc-signer-2:4122
      SIGNER_SIGNER__PROMETHEUS_EXPORTER_ENDPOINT: 0.0.0.0:9183
    ports:
      - "127.0.0.1:8803:8801"

  # Blocklist client.
  # -----------------
  blocklist-client:
    build:
      context: ../
      dockerfile: docker/sbtc/Dockerfile
      target: blocklist-client
    environment:
      BLOCKLIST_CLIENT_RISK_ANALYSIS__API_URL: ${BLOCKLIST_CLIENT_RISK_ANALYSIS__API_URL:-https://public.chainalysis.com}
      BLOCKLIST_CLIENT_RISK_ANALYSIS__API_KEY: ${BLOCKLIST_CLIENT_RISK_ANALYSIS__API_KEY:-}
      BLOCKLIST_CLIENT_SERVER__HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:3030:3030"
    profiles:
      - default

  # Deterministic-DKG seeders.
  # --------------------------
  # Each one waits for its signer to be healthy, then imports the matching
  # SQL dump from devenv/deterministic-dkg/ into the signer's postgres.
  sbtc-signer-seed-1:
    <<: *sbtc-signer-seed
    environment:
      TARGET: postgres-1
    volumes:
      - ../devenv/deterministic-dkg/signer-1.sql:/seed/signer.sql
    depends_on:
      sbtc-signer-1:
        condition: service_healthy

  sbtc-signer-seed-2:
    <<: *sbtc-signer-seed
    environment:
      TARGET: postgres-2
    volumes:
      - ../devenv/deterministic-dkg/signer-2.sql:/seed/signer.sql
    depends_on:
      sbtc-signer-2:
        condition: service_healthy

  sbtc-signer-seed-3:
    <<: *sbtc-signer-seed
    environment:
      TARGET: postgres-3
    volumes:
      - ../devenv/deterministic-dkg/signer-3.sql:/seed/signer.sql
    depends_on:
      sbtc-signer-3:
        condition: service_healthy

  spox:
    image: ghcr.io/stx-labs/spox:v1.0.0@sha256:5759f86020461d1d11a244440ad3badc8c4fceee7743a0aa25d8c2b5025215d5
    environment:
      SPOX_EMILY_ENDPOINT: "http://emily-server:3031"
      SPOX_BITCOIN_RPC_ENDPOINT: "http://devnet:devnet@bitcoin:18443"
      SPOX_NODE_WALLET__NAME: "spox-watch"
      SPOX_NODE_WALLET__RESCAN_TIMESTAMP: "-604800" # last week
      # pox-5 deposit values bcrt1p78dy0epr5znh99lthu5czrc8k8a3sk69czg79vnh6jfccqtkmp3ssd0s7n
      SPOX_DEPOSIT__POX__SIGNERS_XONLY: "48157362b0654badffbb627ce91c7eb352181069db33832e18f035fb58764ecf" # assuming seeded DKG
      SPOX_DEPOSIT__POX__RECIPIENT: "ST000000000000000000002AMW42H.pox-5"
      SPOX_DEPOSIT__POX__MAX_FEE: "80000"
      SPOX_DEPOSIT__POX__LOCK_TIME: "65535"
      SPOX_DEPOSIT__POX__RECLAIM_SCRIPT: "6a" # OP_RETURN
      # sbtc faucet bcrt1pr7gsq32vsczjdgrsnt4ucwjg72nd8rdwtaral23h6twynsjchk6qtfe8ad
      SPOX_DEPOSIT__FAUCET__SIGNERS_XONLY: "48157362b0654badffbb627ce91c7eb352181069db33832e18f035fb58764ecf" # assuming seeded DKG
      SPOX_DEPOSIT__FAUCET__RECIPIENT: "STB44HYPYAT2BB2QE513NSP81HTMYWBJP02HPGK6"
      SPOX_DEPOSIT__FAUCET__MAX_FEE: "80000"
      SPOX_DEPOSIT__FAUCET__LOCK_TIME: "65535"
      SPOX_DEPOSIT__FAUCET__RECLAIM_SCRIPT: "6a" # OP_RETURN
    restart: on-failure
    profiles:
      - default
    depends_on:
      - emily-server
      - bitcoin

  # Bitcoin / Burnchain.
  # --------------------
  bitcoin:
    image: bitcoin/bitcoin:25.2
    ports:
      - "127.0.0.1:18442:18443"
    volumes:
      - ./bitcoin/bitcoin-mempool.conf:/root/.bitcoin/bitcoin.conf
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        bitcoind
    healthcheck:
      test: [ "CMD-SHELL", "bitcoin-cli -rpcwait getblockcount" ]
      interval: 5s
      timeout: 1s
      retries: 3
    profiles:
      - default
      - bitcoin-mempool
      - bitcoin

  bitcoin-pruned:
    image: bitcoin/bitcoin:25.2
    ports:
      - "127.0.0.1:18443:18443"
    depends_on:
      bitcoin:
        condition: service_healthy
    volumes:
      - ./bitcoin/bitcoin-pruned.conf:/root/.bitcoin/bitcoin.conf
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        bitcoind
    healthcheck:
      test: [ "CMD-SHELL", "bitcoin-cli -rpcwait getblockcount" ]
      interval: 5s
      timeout: 1s
      retries: 3
    profiles:
      - default
      - bitcoin-mempool
      - bitcoin

  bitcoin-miner:
    image: bitcoin/bitcoin:25.2
    depends_on:
      bitcoin:
        condition: service_healthy
    volumes:
      - ./bitcoin/bitcoin.conf:/root/.bitcoin/bitcoin.conf
      - ./bitcoin/miner.sh:/miner.sh
    environment:
      BTC_ADDR: *BTC_ADDR
      MINE_INTERVAL: *MINE_INTERVAL
      MINE_INTERVAL_EPOCH3: *MINE_INTERVAL_EPOCH3
      MINE_INTERVAL_EPOCH25: *MINE_INTERVAL_EPOCH25
      MINE_INTERVAL_EPOCH4: *MINE_INTERVAL_EPOCH4
      MINE_GRACE_SECS: *MINE_GRACE_SECS
      RETRY_SLEEP_DURATION: 5
      INIT_BLOCKS: 101
      STACKS_30_HEIGHT: *STACKS_30_HEIGHT
      STACKS_25_HEIGHT: *STACKS_25_HEIGHT
      STACKS_40_HEIGHT: *STACKS_40_HEIGHT
      TOPUP_WALLETS: "btc_staking:0.1:1"
    entrypoint: /miner.sh
    profiles:
      - default
      - bitcoin-mempool

  # Stacks Blockchain.
  # ------------------
  stacks-node:
    image: ghcr.io/stacks-network/stacks-core:4.0.2@sha256:c62770f5dee7a3fa69351b948adf845f0c5cbc1e93414f4264368977aa1aa8ad
    profiles:
      - default
    depends_on:
      bitcoin:
        condition: service_healthy
    ports:
      - "127.0.0.1:20443:20443"
    volumes:
      - ./stacks/stacks-regtest-miner.toml:/data/config.toml.in
      - ./bitcoin/bitcoin.conf:/root/.bitcoin/bitcoin.conf
    environment:
      # STACKS_LOG_TRACE: 1 # uncomment for trace logging
      # STACKS_LOG_DEBUG: 1
      # RUST_LOG: debug
      BITCOIN_PEER_HOST: bitcoin
      BITCOIN_PEER_PORT: *BITCOIN_PEER_PORT
      BITCOIN_RPC_PORT: *BITCOIN_RPC_PORT
      BITCOIN_RPC_USER: *BITCOIN_RPC_USER
      BITCOIN_RPC_PASS: *BITCOIN_RPC_PASS
      MINER_SEED: *MINER_SEED
      STACKS_20_HEIGHT: *STACKS_20_HEIGHT
      STACKS_2_05_HEIGHT: *STACKS_2_05_HEIGHT
      STACKS_21_HEIGHT: *STACKS_21_HEIGHT
      STACKS_POX2_HEIGHT: *STACKS_POX2_HEIGHT
      STACKS_22_HEIGHT: *STACKS_22_HEIGHT
      STACKS_23_HEIGHT: *STACKS_23_HEIGHT
      STACKS_24_HEIGHT: *STACKS_24_HEIGHT
      STACKS_25_HEIGHT: *STACKS_25_HEIGHT
      STACKS_30_HEIGHT: *STACKS_30_HEIGHT
      STACKS_31_HEIGHT: *STACKS_31_HEIGHT
      STACKS_32_HEIGHT: *STACKS_32_HEIGHT
      STACKS_33_HEIGHT: *STACKS_33_HEIGHT
      STACKS_34_HEIGHT: *STACKS_34_HEIGHT
      STACKS_40_HEIGHT: *STACKS_40_HEIGHT
      POX_PREPARE_LENGTH: *POX_PREPARE_LENGTH
      POX_REWARD_LENGTH: *POX_REWARD_LENGTH
      REWARD_RECIPIENT: *REWARD_RECIPIENT
    entrypoint:
      - /bin/bash
      - -c
      - |
        cd /data/
        set -e
        perl -pe 's/\$\{?([A-Za-z_][A-Za-z0-9_]*)\}?/$$ENV{$1}/ge' < config.toml.in > config.toml
        exec stacks-node start --config config.toml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stacker:
    build: stacker
    environment:
      STACKS_CORE_RPC_HOST: stacks-node
      STACKS_CORE_RPC_PORT: 20443
      STACKING_CYCLES: *STACKING_CYCLES
      STACKING_KEYS: 41634762d89dfa09133a4a8e9c1378d0161d29cd0a9433b51f1e3d32947a73dc01,9bfecf16c9c12792589dd2b843f850d5b89b81a04f8ab91c083bdf6709fbefee01,3ec0ca5770a356d6cd1a9bfcbf6cd151eb1bd85c388cc00648ec4ef5853fdb7401
      STACKS_25_HEIGHT: *STACKS_25_HEIGHT
      STACKS_30_HEIGHT: *STACKS_30_HEIGHT
      STACKS_40_HEIGHT: *STACKS_40_HEIGHT
      POX_PREPARE_LENGTH: *POX_PREPARE_LENGTH
      POX_REWARD_LENGTH: *POX_REWARD_LENGTH
      STACKING_INTERVAL: 2 # interval (seconds) for checking if stacking transactions are needed
      POST_TX_WAIT: 10 # seconds to wait after a stacking transaction broadcast before continuing the loop
      SERVICE_NAME: stacker
    depends_on:
      - stacks-node
    profiles:
      - default

  # PoX-5 activator: deploys signer-manager, registers signers, stakes STX, and
  # locks BTC for L1 bonds once epoch 4.0 is active. Ported from stx-labs
  # infrastructure testnet activation-ops btc-staker.
  btc-staker:
    build: stacker
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        exec npx tsx /root/btc-staker.ts
    environment:
      SERVICE_NAME: btc-staker
      STACKS_CORE_RPC_HOST: stacks-node
      STACKS_CORE_RPC_PORT: 20443
      STACKS_API_HOST: stacks-api
      STACKS_API_PORT: 3999
      STACKS_CHAIN_ID: "0x80000000"
      STACKING_KEYS: 41634762d89dfa09133a4a8e9c1378d0161d29cd0a9433b51f1e3d32947a73dc01,9bfecf16c9c12792589dd2b843f850d5b89b81a04f8ab91c083bdf6709fbefee01,3ec0ca5770a356d6cd1a9bfcbf6cd151eb1bd85c388cc00648ec4ef5853fdb7401

      - default

  # Stacks / Hiro API.
  # ------------------
  postgres-stacks-api:
    image: postgres:16.6-bookworm@sha256:c965017e1d29eb03e18a11abc25f5e3cd78cb5ac799d495922264b8489d5a3a1
    container_name: postgres-stacks-api
    stop_grace_period: 5s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    profiles:
      - default

  stacks-api:
    image: hirosystems/stacks-blockchain-api:9.0.2
    container_name: stacks-api
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:3999:3999"
      - "127.0.0.1:3700:3700"
    depends_on:
      - postgres-stacks-api
      - stacks-node
      - bitcoin
    environment:
      NODE_ENV: "production"
      PG_HOST: "postgres-stacks-api"
      PG_PORT: 5432
      PG_USER: "postgres"
      PG_PASSWORD: "postgres"
      PG_DATABASE: "postgres"
      PG_SCHEMA: "public"
      STACKS_CHAIN_ID: "0x80000000"
      STACKS_CORE_EVENT_PORT: 3700
      STACKS_CORE_EVENT_HOST: "0.0.0.0"
      STACKS_BLOCKCHAIN_API_PORT: 3999
      STACKS_BLOCKCHAIN_API_HOST: "0.0.0.0"
      STACKS_CORE_RPC_HOST: "stacks-node"
      STACKS_CORE_RPC_PORT: 20443
      API_DOCS_URL: http://127.0.0.1:3999/doc
    profiles:
      - default

  stacks-explorer:
    image: hirosystems/explorer:1.340.3@sha256:cf014d3c1e6a0ef6414b2a1d1b4198599c4e169330033919408bb69ef22c33b7
    platform: linux/amd64
    container_name: stacks-explorer
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:3020:3000"
    depends_on:
      - bitcoin
      - stacks-node
      - stacks-api
      - postgres-stacks-api
    environment:
      NEXT_PUBLIC_MAINNET_API_SERVER: "http://stacks-api:3999"
    profiles:
      - default

  # Mempool.
  # --------
  electrs:
    image: mempool/electrs:latest
    container_name: electrs
    stop_grace_period: 5s
    ports:
      - "127.0.0.1:60401:60401"
      - "127.0.0.1:3002:3002"
    depends_on:
      bitcoin:
        condition: service_healthy
      bitcoin-miner:
        condition: service_started
    environment:
      BITCOIN_RPC_PORT: *BITCOIN_RPC_PORT
    entrypoint:
      - /bin/bash
      - -c
      - |
        electrs --network regtest \
          --jsonrpc-import \
          --cookie "devnet:devnet" \
          --http-addr="0.0.0.0:3002" \
          --electrum-rpc-addr="0.0.0.0:60401" \
          --daemon-rpc-addr="bitcoin:$${BITCOIN_RPC_PORT}" \
          --electrum-txs-limit=2048 \
          --utxos-limit=2048 \
          --db-dir="/opt" \
          --cors="*" \
          -vv
    profiles:
      - bitcoin-mempool

  mempool-web:
    image: mempool/frontend:v3.3.0
    container_name: mempool-web
    stop_grace_period: 5s
    depends_on:
      - mempool-api
      - electrs
    user: "1000:1000"
    restart: on-failure
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      FRONTEND_HTTP_PORT: "8083"
      BACKEND_MAINNET_HTTP_HOST: "mempool-api"
      BACKEND_MAINNET_HTTP_PORT: "8999"
      MAINNET_ENABLED: "false"
      REGTEST_ENABLED: "true"
      ROOT_NETWORK: "regtest"
      MINING_DASHBOARD: "false"
    profiles:
      - bitcoin-mempool

  mempool-api:
    image: mempool/backend:v3.3.0
    container_name: mempool-api
    stop_grace_period: 5s
    depends_on:
      - electrs
    user: "1000:1000"
    restart: on-failure
    ports:
      - "127.0.0.1:8999:8999"
    environment:
      MEMPOOL_BACKEND: "electrum"
      MEMPOOL_NETWORK: "regtest"
      ELECTRUM_HOST: "electrs"
      ELECTRUM_PORT: "60401"
      ELECTRUM_TLS_ENABLED: "false"
      CORE_RPC_HOST: "bitcoin"
      CORE_RPC_PORT: "18443"
      CORE_RPC_USERNAME: "devnet"
      CORE_RPC_PASSWORD: "devnet"
      DATABASE_ENABLED: "false"
      STATISTICS_ENABLED: "false"
    command: "./start.sh"
    profiles:
      - bitcoin-mempool

  prometheus:
    image: prom/prometheus:v3.2.0
    restart: always
    volumes:
      - ./observability/local-prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - vector
    profiles:
      - observability

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.5.2-ubuntu
    user: '472'
    restart: always
    environment:
      GF_INSTALL_PLUGINS: 'grafana-clock-panel,grafana-simple-json-datasource'
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: false
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/:/etc/grafana/provisioning/
    ports:
      - "127.0.0.1:3040:3000"
    depends_on:
      - prometheus
      - loki
    profiles:
      - observability

  vector:
    image: timberio/vector:0.43.1-distroless-static
    command: --config /etc/vector/vector.toml
    restart: always
    ports:
      - "127.0.0.1:9598:9598"
      - "127.0.0.1:24224:24224"
    volumes:
      - ./observability/vector.toml:/etc/vector/vector.toml:ro
    profiles:
      - observability
